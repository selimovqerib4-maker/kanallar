let channels=[],currentIndex=-1,activeCat='hamisi';let favorites=JSON.parse(localStorage.getItem('fav')||'[]');
const video=document.getElementById('video'),list=document.getElementById('chanList'),sidebar=document.getElementById('sidebar'),menuBtn=document.getElementById('menuBtn'),count=document.getElementById('count');
function getCat(n){n=n.toLowerCase();if(n.includes('idman')||n.includes('futbol')||n.includes('sport')||n.includes('bein')||n.includes('aspor')||n.includes('tv 8')||n.includes('tv8'))return 'futbol';if(n.includes('belge')||n.includes('sənəd')||n.includes('discovery')||n.includes('national')||n.includes('history')||n.includes('nat geo')||n.includes('trt belgesel'))return 'belgesel';if(n.includes('film')||n.includes('cinema')||n.includes('sinema')||n.includes('max')||n.includes('cine')||n.includes('şaban')||n.includes('cennet')||n.includes('nostalji'))return 'film';if(n.includes('atv')||n.includes('arb')||n.includes('xəzər')||n.includes('xezer')||n.includes('itv')||n.includes('aztv')||n.includes('space')||n.includes('lider')||n.includes('azad')||n.includes('könül')||n.includes('konul')||n.includes('kəpəz')||n.includes('kepez')||n.includes('el tv')||n.includes('az tv')||n.includes('ftv')||n.includes('gunaz')||n.includes('ayaz')||n.includes('music')||n.includes('simvol')||n.includes('maxtv')||n.includes('kntv'))return 'az';if(n.includes('trt')||n.includes('kanal d')||n.includes('show')||n.includes('star')||n.includes('haber')||n.includes('a2')||n.includes('teve2')||n.includes('tv2')||n.includes('now')||n.includes('tabii')||n.includes('beyaz')||n.includes('kanal 7')||n.includes('360'))return 'turk';return 'diger';}
function toggleFav(url){if(favorites.includes(url))favorites=favorites.filter(f=>f!==url);else favorites.push(url);localStorage.setItem('fav',JSON.stringify(favorites));renderList();}
function parseM3U(text){channels=[];let lines=text.split('\n');let name='';lines.forEach(line=>{line=line.trim();if(line.startsWith('#EXTINF')){let m=line.match(/,(.*)$/);name=m?m[1].trim():'Kanal';}else if(line&&!line.startsWith('#')&&line.startsWith('http')){channels.push({name:name,url:line});}});count.textContent='('+channels.length+')';renderList();if(channels.length>0)playChannel(0);}
function renderList(){list.innerHTML='';let filtered=channels.map((c,idx)=>({...c,origIdx:idx})).filter(c=>{if(activeCat==='hamisi')return true;if(activeCat==='sevimli')return favorites.includes(c.url);return getCat(c.name)===activeCat;});filtered.forEach(c=>{let li=document.createElement('li');let isFav=favorites.includes(c.url);li.innerHTML=`<span style='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>${c.name}</span><span onclick='event.stopPropagation();toggleFav("${c.url.replace(/"/g,'')}")' style='margin-left:8px'>${isFav?'⭐':'☆'}</span>`;if(c.origIdx===currentIndex)li.classList.add('active');li.onclick=()=>{playChannel(c.origIdx);sidebar.classList.remove('open');menuBtn.textContent='☰';};list.appendChild(li);});}
let hls;function playChannel(i){currentIndex=i;let c=channels[i];renderList();if(hls)hls.destroy();if(c.url.includes('.m3u8')&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());}else{video.src=c.url;video.play().catch(()=>{});}}
menuBtn.onclick=()=>{sidebar.classList.toggle('open');menuBtn.textContent=sidebar.classList.contains('open')?'✕':'☰';};
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;renderList();});
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('light');};
let startY=0,startVol=1;document.getElementById('gestureR').addEventListener('touchstart',e=>{startY=e.touches[0].clientY;startVol=video.volume;});document.getElementById('gestureR').addEventListener('touchmove',e=>{let diff=(startY-e.touches[0].clientY)/200;let v=Math.min(1,Math.max(0,startVol+diff));video.volume=v;let ind=document.getElementById('volInd');ind.style.display='block';ind.textContent='🔊 Səs: '+Math.round(v*100)+'%';});document.getElementById('gestureR').addEventListener('touchend',()=>{setTimeout(()=>document.getElementById('volInd').style.display='none',1000)});
let startX=0;document.getElementById('gestureL').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;});document.getElementById('gestureL').addEventListener('touchend',e=>{let diff=e.changedTouches[0].clientX-startX;if(Math.abs(diff)>80){if(diff>0)playChannel((currentIndex-1+channels.length)%channels.length);else playChannel((currentIndex+1)%channels.length);}});
parseM3U(m3uText);
