<!DOCTYPE html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Kanallar TV - Qara Ag</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}#app{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}#videoWrap{position:relative;flex:1;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:contain;background:#000}#videoOverlay{position:absolute;inset:0;z-index:2}#leftZone{position:absolute;left:0;bottom:0;width:35%;height:30%;z-index:4}#rightZone{position:absolute;right:0;bottom:0;width:35%;height:30%;z-index:4}#volZone{position:absolute;right:0;top:0;width:18%;height:100%;z-index:4}#topInfo{position:absolute;top:0;left:0;right:0;padding:14px 16px;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent);z-index:6;transform:translateY(-100%);transition:.25s;display:flex;justify-content:space-between;align-items:center}#topInfo.show{transform:translateY(0)}#chName{color:#fff;font-size:16px;font-weight:700}#chNum{color:#888;font-size:12px;margin-top:2px}#catName{color:#000;background:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}#centerBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:16px 28px;border-radius:14px;font-weight:800;font-size:18px;z-index:8;display:none}#centerBox.show{display:block}#cats{display:flex;gap:6px;padding:8px 10px;background:#0a0a0a;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;overflow-x:auto}.cat{padding:8px 14px;border-radius:20px;background:#1a1a1a;color:#aaa;font-size:12px;font-weight:600;border:1px solid #222;flex-shrink:0}.cat.active{background:#fff;color:#000;border-color:#fff}#list{flex:0 0 42%;background:#050505;overflow-y:auto;padding:8px;border-top:1px solid #111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#111;border:1px solid #1e1e1e;border-radius:10px;color:#fff;font-size:13px;font-weight:600}.item.active{background:#fff;color:#000;border-color:#fff}#bottomBar{padding:10px 12px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}#geriBtn{background:#111;color:#fff;border:1px solid #222;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700}#settingBtn{background:transparent;color:#555;border:none;font-size:12px}#hint{color:#333;font-size:10px;text-align:center;flex:1}#settings{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20;display:none;padding:20px}#settings.open{display:block}.setBox{background:#111;border:1px solid #222;border-radius:16px;padding:16px;max-width:400px;margin:40px auto}</style></head><body><div id="app"><div id="videoWrap"><video id="v" playsinline autoplay></video><div id="videoOverlay"></div><div id="leftZone"></div><div id="rightZone"></div><div id="volZone"></div><div id="topInfo"><div><div id="chName">Kanal</div><div id="chNum">0 / 0</div></div><div id="catName">HAMISI</div></div><div id="centerBox"></div></div><div id="cats"></div><div id="list"><div class="grid" id="grid"></div></div><div id="bottomBar"><button id="geriBtn" onclick="if(confirm('Çıxmaq?'))history.back()">← Geri Çıx</button><div id="hint">AŞAĞI SOL/SAĞ → Kanal | SAĞ KENAR → Səs</div><button id="settingBtn" onclick="document.getElementById('settings').classList.toggle('open')">⚙ Setting</button></div></div><div id="settings" onclick="this.classList.remove('open')"><div class="setBox" onclick="event.stopPropagation()"><h3 style="color:#fff">⚙ Setting</h3><p style="color:#aaa;font-size:13px;margin-top:10px">Tema: Qara-Ağ<br>GitHub: selimovqerib4-maker<br>CDN: raw.githack.com - Aktiv</p><button onclick="document.getElementById('settings').classList.remove('open')" style="width:100%;margin-top:15px;padding:10px;background:#fff;color:#000;border:none;border-radius:8px;font-weight:700">Bağla</button></div></div><script>
const rawChannels=[{"name":"Trt 1 HD","url":"https://tv-trt1.medya.trt.com.tr/master_1080.m3u8","cat":"TÜRK"},{"name":"Kanal 7 720p","url":"https://kanal7-live.daioncdn.net/kanal7/kanal7.m3u8","cat":"TÜRK"},{"name":"Star Tv HD","url":"https://dogus.daioncdn.net/startv/startv.m3u8?ce=3&app=1740db13-3ee9-4858-8d2c-b1a9cfaa3718","cat":"TÜRK"},{"name":"Kanal D","url":"https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web","cat":"TÜRK"},{"name":"Now TV","url":"https://dogus.tecostream.xyz/now.m3u8","cat":"TÜRK"},{"name":"SHOW TV","url":"https://ciner.daioncdn.net/showtv/showtv.m3u8?ce=3&app=4bc856ef-4c68-4a94-bc87-37dfaaa66558","cat":"TÜRK"},{"name":"TV 8","url":"https://tv8.daioncdn.net/tv8/tv8_1080p.m3u8?app=tv8_web","cat":"TÜRK"},{"name":"TRT Türk","url":"https://tv-trtturk.medya.trt.com.tr/master_720.m3u8","cat":"TÜRK"},{"name":"AZAD AZERBAYCAN TV","url":"https://lives.atv.az:5443/ATV_TV_STREAM/streams/atvcanli.m3u8","cat":"AZ"},{"name":"Könül Tv","url":"http://cdn-konultvazerbaijan.yayin.com.tr/konultvazerbaijan/konultvazerbaijan/playlist.m3u8","cat":"AZ"},{"name":"AYAZ TV","url":"https://janya-ayaztv.vgcdn.net/ptnr-WebApp/title-Ayaz_TV/v1/vglive-sk-934820/480p/480p.m3u8","cat":"AZ"},{"name":"EL TV","url":"http://85.132.53.162:1935/live/eltv/playlist.m3u8","cat":"AZ"},{"name":"XEZER TV","url":"https://xezerxeber.az/stream/main_stream.m3u8","cat":"AZ"},{"name":"AZ TV","url":"https://str.yodacdn.net/azertv/tracks-v1a1/mono.ts.m3u8","cat":"AZ"},{"name":"FTV","url":"http://stream.ftv.az/live/ftv.m3u8","cat":"AZ"},{"name":"GUNAZ TV","url":"https://tv.gunaz.tv/hls/live.m3u8","cat":"AZ"}];
let allChannels=[...rawChannels],filtered=[],cur=0,curCat='HAMISI';const cats=['HAMISI','SEVİMLİ','AZ','TÜRK','FUTBOL','BƏLGƏSƏL','FİLM'];let favs=JSON.parse(localStorage.getItem('fav')||'[]');async function tryRemote(){try{let r=await fetch('https://raw.githack.com/selimovqerib4-maker/kanallar/main/kanallar.m3u?t='+Date.now());if(r.ok){let txt=await r.text();if(txt.includes('#EXTINF')){let lines=txt.split('\n'),parsed=[];for(let i=0;i<lines.length;i++){if(lines[i].startsWith('#EXTINF')){let nm=lines[i].split(',')[1]||'Kanal';let u=(lines[i+1]||'').trim();if(u.startsWith('http'))parsed.push({name:nm.trim(),url:u,cat:'TÜRK'});}}if(parsed.length>5){allChannels=parsed;filterCat('HAMISI');}}}}catch(e){}}function renderCats(){let h='';cats.forEach(c=>{h+=`<div class="cat ${c===curCat?'active':''}" onclick="filterCat('${c}')">${c}</div>`;});document.getElementById('cats').innerHTML=h;}function filterCat(c){curCat=c;cur=0;if(c==='HAMISI')filtered=[...allChannels];else if(c==='SEVİMLİ')filtered=allChannels.filter((_,i)=>favs.includes(i));else filtered=allChannels.filter(ch=>ch.cat===c);if(filtered.length===0)filtered=[...allChannels];renderCats();renderGrid();play(cur);}function renderGrid(){let g='';filtered.forEach((ch,i)=>{let idx=allChannels.indexOf(ch);let fav=favs.includes(idx)?'★':'☆';g+=`<div class="item ${i===cur?'active':''}" onclick="play(${i})"><span>${ch.name}</span><span style="margin-left:auto" onclick="event.stopPropagation();toggleFav(${idx})">${fav}</span></div>`;});document.getElementById('grid').innerHTML=g;document.getElementById('chNum').textContent=(cur+1)+' / '+filtered.length;}function toggleFav(idx){if(favs.includes(idx))favs=favs.filter(f=>f!==idx);else favs.push(idx);localStorage.setItem('fav',JSON.stringify(favs));renderGrid();}const v=document.getElementById('v');function play(i){if(i<0)i=filtered.length-1;if(i>=filtered.length)i=0;cur=i;let ch=filtered[i];document.getElementById('chName').textContent=ch.name;document.getElementById('chNum').textContent=(i+1)+' / '+filtered.length;document.getElementById('catName').textContent=curCat;showTop();renderGrid();if(window.hls)try{window.hls.destroy()}catch{}if(Hls.isSupported()){window.hls=new Hls();window.hls.loadSource(ch.url);window.hls.attachMedia(v);window.hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}else{v.src=ch.url;v.play();}}function showCenter(t){let b=document.getElementById('centerBox');b.textContent=t;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1500);}function showTop(){let t=document.getElementById('topInfo');t.classList.add('show');clearTimeout(window.topT);window.topT=setTimeout(()=>t.classList.remove('show'),2500);}document.getElementById('leftZone').addEventListener('click',()=>{play(cur-1);showCenter('◀ Əvvəlki');});document.getElementById('rightZone').addEventListener('click',()=>{play(cur+1);showCenter('Növbəti ▶');});let volY=0,volV=0;document.getElementById('volZone').addEventListener('touchstart',e=>{volY=e.touches[0].clientY;volV=v.volume;},{passive:true});document.getElementById('volZone').addEventListener('touchmove',e=>{let dy=volY-e.touches[0].clientY;let nv=Math.min(1,Math.max(0,volV+dy/300));v.volume=nv;showCenter('🔊 '+Math.round(nv*100)+'%');},{passive:true});let sx=0,sy=0;document.getElementById('videoOverlay').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;showTop();},{passive:true});document.getElementById('videoOverlay').addEventListener('touchend',e=>{let ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY,dx=ex-sx,dy=ey-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){if(dx<0)play(cur+1);else play(cur-1);}else if(Math.abs(dy)>60){if(dy<0)v.volume=Math.min(1,v.volume+0.15);else v.volume=Math.max(0,v.volume-0.15);showCenter('🔊 '+Math.round(v.volume*100)+'%');}},{passive:true});renderCats();filtered=[...allChannels];renderGrid();play(0);tryRemote();
</script></body></html>
