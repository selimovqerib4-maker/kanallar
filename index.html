<!DOCTYPE html>
<html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Qerib TV</title><style>:root{--bg:#0a0a0a;--card:#151515;--text:#e0e0e0}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;overflow:hidden;height:100vh}body.light{--bg:#f5f5f5;--card:#fff;--text:#111}header{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--card);border-bottom:1px solid #222;position:fixed;top:0;left:0;right:0;z-index:100}.left{display:flex;align-items:center;gap:12px}#menuBtn{font-size:22px;background:none;border:none;color:var(--text);cursor:pointer;padding:4px 8px}#logo{font-weight:700;font-size:15px}.right{display:flex;gap:6px}.theme,.abtn{border:1px solid #333;background:none;color:var(--text);padding:6px 10px;border-radius:20px;font-size:11px;cursor:pointer}#catBar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid #222;white-space:nowrap;position:fixed;top:50px;left:0;right:0;z-index:90}.cat{border:1px solid #333;background:var(--bg);color:var(--text);padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}.cat.active{background:var(--text);color:var(--bg)}#sidebar{position:fixed;top:98px;left:0;bottom:0;width:260px;background:var(--card);transform:translateX(-100%);transition:0.25s;z-index:95;overflow-y:auto;border-right:1px solid #222}#sidebar.open{transform:translateX(0)}#chanList{list-style:none;padding:8px}#chanList li{padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #1e1e1e;display:flex;justify-content:space-between;align-items:center}#chanList li.active{background:#222}#main{margin-top:98px;height:calc(100vh - 98px);display:flex;flex-direction:column;position:relative}#playerWrap{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}video{width:100%;height:100%;background:#000;object-fit:contain}video.fit{object-fit:contain!important}video.zoom{object-fit:cover!important}video.original{object-fit:contain!important}#gestureLeft{position:absolute;left:0;top:0;bottom:0;width:50%;z-index:5}#gestureRight{position:absolute;right:0;top:0;bottom:0;width:50%;z-index:5}#topOverlay{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(#0008,transparent);display:none;z-index:10;align-items:center;padding:10px}#bottomOverlay{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,#000a);display:none;z-index:10;align-items:flex-end;justify-content:space-between;padding:12px}#topOverlay.show,#bottomOverlay.show{display:flex}#exitBtn{position:absolute;right:12px;bottom:12px;background:#000c;border:1px solid #444;color:#fff;border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;z-index:20}#volInd{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#000a;padding:8px;border-radius:8px;display:none;z-index:30;color:#fff}#chanInd{position:absolute;left:50%;top:20px;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;font-size:13px;display:none;z-index:30;color:#fff}</style></head><body><header><div class="left"><button id="menuBtn">☰</button><div id="logo">QERIB TV</div></div><div class="right"><button id="aspectBtn" class="abtn">Ekrana Sığdır</button><button id="themeBtn" class="theme">🌙 Qara</button></div></header><div id="catBar"><button class="cat active" data-cat="hamisi">Hamısı</button><button class="cat" data-cat="sevimli">⭐ Sevimli</button><button class="cat" data-cat="az">Az</button><button class="cat" data-cat="turk">Türk</button><button class="cat" data-cat="futbol">Futbol</button><button class="cat" data-cat="belgesel">Bəlgesəl</button><button class="cat" data-cat="film">Film</button></div><div id="sidebar"><ul id="chanList"></ul></div><div id="main"><div id="playerWrap"><video id="video" playsinline></video><div id="gestureLeft"></div><div id="gestureRight"></div><div id="topOverlay"><span id="nowPlaying" style="color:#fff;font-size:13px"></span></div><div id="bottomOverlay"></div><button id="exitBtn">‹ Geri</button><div id="volInd"></div><div id="chanInd"></div></div></div><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script>
let channels=[],currentIndex=-1,aspectModes=['fit','zoom','original'],aspectIndex=0,hideTimer,activeCat='hamisi';
let favorites=JSON.parse(localStorage.getItem('fav')||'[]');
const video=document.getElementById('video'), list=document.getElementById('chanList'), sidebar=document.getElementById('sidebar');
const menuBtn=document.getElementById('menuBtn'), themeBtn=document.getElementById('themeBtn'), aspectBtn=document.getElementById('aspectBtn');
const exitBtn=document.getElementById('exitBtn'), playerWrap=document.getElementById('playerWrap');
const topOverlay=document.getElementById('topOverlay'), bottomOverlay=document.getElementById('bottomOverlay'), nowPlaying=document.getElementById('nowPlaying');
function getCat(name){let n=name.toLowerCase();if(n.includes('idman')||n.includes('futbol')||n.includes('sport')||n.includes('bein')||n.includes('aspor')||n.includes('trt spor')) return 'futbol';if(n.includes('belgesel')||n.includes('bəlge')||n.includes('sənəd')||n.includes('discovery')||n.includes('national')||n.includes('history')||n.includes('bbc earth')||n.includes('animal')) return 'belgesel';if(n.includes('film')||n.includes('movie')||n.includes('sinema')) return 'film';if(n.includes('atv')||n.includes('arb')||n.includes('xəzər')||n.includes('xezer')||n.includes('itv')||n.includes('aztv')||n.includes('space')||n.includes('lider')) return 'az';if(n.includes('trt')||n.includes('kanal d')||n.includes('show')||n.includes('star')||n.includes('haber')||n.includes('a2')||n.includes('teve2')) return 'turk';return 'diger';}
function toggleFav(url){if(favorites.includes(url)) favorites=favorites.filter(f=>f!==url); else favorites.push(url);localStorage.setItem('fav',JSON.stringify(favorites));renderList();}
async function loadM3U(){try{let res=await fetch('./kanallar.m3u?v='+Date.now());let text=await res.text();if(text.includes('#EXTM3U')) parseM3U(text);}catch(e){console.log('m3u yoxdur');}}
function parseM3U(text){channels=[];let lines=text.split('\n');let name='';lines.forEach(line=>{line=line.trim();if(line.startsWith('#EXTINF')){let m=line.match(/,(.*)$/);name=m?m[1].trim():'Kanal';}else if(line&&!line.startsWith('#')&&line.startsWith('http')){channels.push({name:name,url:line});}});renderList();if(channels.length>0&&currentIndex==-1) playChannel(0);}
function renderList(){list.innerHTML='';let filtered=channels.map((c,idx)=>({...c,origIdx:idx})).filter(c=>{if(activeCat==='hamisi') return true;if(activeCat==='sevimli') return favorites.includes(c.url);return getCat(c.name)===activeCat;});filtered.forEach((c)=>{let li=document.createElement('li');let isFav=favorites.includes(c.url);li.innerHTML=`<span style='flex:1;overflow:hidden;text-overflow:ellipsis'>${c.name}</span><span onclick='event.stopPropagation();toggleFav("${c.url}")' style='margin-left:8px;font-size:16px'>${isFav?'⭐':'☆'}</span>`;if(c.origIdx===currentIndex) li.classList.add('active');li.onclick=()=>{playChannel(c.origIdx);sidebar.classList.remove('open');menuBtn.textContent='☰';};list.appendChild(li);});}
let hls;function playChannel(i){currentIndex=i;let c=channels[i];nowPlaying.textContent=c.name;renderList();if(hls) hls.destroy();if(c.url.includes('.m3u8')&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());}else{video.src=c.url;video.play();}showControls();if(playerWrap.requestFullscreen) playerWrap.requestFullscreen().catch(()=>{});}
function showControls(){topOverlay.classList.add('show');bottomOverlay.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{topOverlay.classList.remove('show');bottomOverlay.classList.remove('show');},3000);}
playerWrap.addEventListener('click',showControls);
menuBtn.onclick=()=>{sidebar.classList.toggle('open');menuBtn.textContent=sidebar.classList.contains('open')?'---':'☰';};
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;renderList();});
themeBtn.onclick=()=>{document.body.classList.toggle('light');themeBtn.textContent=document.body.classList.contains('light')?'☀️ Ağ':'🌙 Qara';localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');};
let saved=localStorage.getItem('theme');if(saved==='light'){document.body.classList.add('light');themeBtn.textContent='☀️ Ağ';}
aspectBtn.onclick=()=>{aspectIndex=(aspectIndex+1)%aspectModes.length;let mode=aspectModes[aspectIndex];video.className=mode;aspectBtn.textContent=mode==='fit'?'Ekrana Sığdır':mode==='zoom'?'Yaxınlaşdır':'Orijinal';};
video.className='fit';
let startY=0,startVol=1;document.getElementById('gestureRight').addEventListener('touchstart',e=>{startY=e.touches[0].clientY;startVol=video.volume;});document.getElementById('gestureRight').addEventListener('touchmove',e=>{let diff=(startY-e.touches[0].clientY)/200;let v=Math.min(1,Math.max(0,startVol+diff));video.volume=v;let ind=document.getElementById('volInd');ind.style.display='block';ind.textContent='Səs: '+Math.round(v*100)+'%';});document.getElementById('gestureRight').addEventListener('touchend',()=>{setTimeout(()=>document.getElementById('volInd').style.display='none',1000)});
let startX=0;document.getElementById('gestureLeft').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;});document.getElementById('gestureLeft').addEventListener('touchend',e=>{let diff=e.changedTouches[0].clientX-startX;if(Math.abs(diff)>80){if(diff>0) playChannel((currentIndex-1+channels.length)%channels.length);else playChannel((currentIndex+1)%channels.length);let ind=document.getElementById('chanInd');ind.textContent=channels[currentIndex].name;ind.style.display='block';setTimeout(()=>ind.style.display='none',1500);}});
exitBtn.onclick=()=>{if(document.fullscreenElement) document.exitFullscreen();video.pause();if(window.Android) window.Android.closeApp();else history.back();};
loadM3U();setInterval(loadM3U,60000);
</script></body></html>
