<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>body{background:#000;color:#fff;margin:0;font-family:Arial}div{padding:14px;border-bottom:1px solid #222}#v{width:100%;height:240px;background:#111}</style></head><body><video id="v" controls></video><div id="list"></div><script>const M3U="https://cdn.statically.io/gh/selimovqerib4-maker/kanallar/main/983421348.m3u";async function y(){let t=await(await fetch(M3U+"?v="+Date.now())).text();let a=t.split("\n"),n="",L=document.getElementById("list");L.innerHTML="";a.forEach(l=>{if(l.startsWith("#EXTINF"))n=l.split(",").pop();else if(l.startsWith("http")){let u=l.trim(),d=document.createElement("div");d.textContent=n;d.onclick=()=>{let v=document.getElementById("v");if(Hls.isSupported()){let h=new Hls();h.loadSource(u);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play())}else{v.src=u;v.play()}};L.appendChild(d)}})}y();setInterval(y,20000);</script></body></html>
