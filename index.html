<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Qerib TV M3U AUTO</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden}
body.light{background:#f5f5f5;color:#000}body.light header,body.light #side,body.light #catBar,body.light #grid div{background:#fff;color:#000;border-color:#ddd}
header{height:48px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:1px solid #222;transition:.3s}header.hide{transform:translateY(-110%)}
#catBar{display:flex;gap:6px;padding:6px;background:#111;position:fixed;top:48px;left:0;right:0;z-index:90}.cat{padding:6px 14px;border-radius:20px;border:1px solid #333;background:#000;color:#fff;font-size:12px}.cat.active{background:#fff;color:#000}
#wrap{margin-top:90px;height:calc(100vh - 90px);position:relative}#vidBox{width:100%;height:38vh;background:#000;position:relative;overflow:hidden}#vidBox.full{position:fixed!important;top:0;left:0;right:0;bottom:0;height:100vh!important;z-index:999}video{width:100%;height:100%;object-fit:contain}
#gR{position:absolute;right:0;top:0;bottom:0;width:40%;z-index:30}#gL{position:absolute;left:0;top:0;bottom:0;width:60%;z-index:30}
#volBox{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#000e;color:#fff;padding:10px;border-radius:20px;display:none;flex-direction:column;align-items:center;z-index:40;border:1px solid #333}
#side{position:fixed;top:90px;left:0;bottom:0;width:300px;background:#111;transform:translateX(-100%);transition:.25s;z-index:150;overflow:auto;border-right:1px solid #222}#side.open{transform:translateX(0)}#list{list-style:none;padding:6px}#list li{padding:12px;border-bottom:1px solid #222;border-radius:8px;display:flex;justify-content:space-between}#list li.active{background:#fff;color:#000}
#grid{height:calc(62vh - 42px);overflow:auto;padding:6px}#grid div{padding:12px;background:#111;border-radius:8px;margin-bottom:5px;border:1px solid #222;display:flex;justify-content:space-between}#grid div.active{border-color:#fff}
#backBtn{position:fixed;bottom:15px;right:15px;background:#000c;color:#fff;padding:10px 16px;border-radius:20px;border:1px solid #333;z-index:80;font-size:12px}.btn{padding:6px 10px;border-radius:15px;border:1px solid #333;background:#0008;color:#fff;font-size:11px}
</style></head><body>
<header id="hd"><div style="display:flex;gap:8px;align-items:center"><button id="mn" style="font-size:20px;background:none;border:none;color:inherit">☰</button><b>QERIB TV</b> <span id="cnt"></span></div><div style="display:flex;gap:6px"><button id="th" class="btn">🌙</button><button id="fs" class="btn">⛶</button></div></header>
<div id="catBar"><button class="cat active" data-c="hamisi">Hamısı</button><button class="cat" data-c="sevimli">⭐ Sevimli (<span id="favCnt">0</span>)</button></div>
<div id="wrap"><div id="vidBox"><video id="v" playsinline></video><div id="gL"></div><div id="gR"></div><div id="volBox"><div id="vt">100%</div><div style="width:4px;height:80px;background:#333;border-radius:5px;position:relative;margin-top:6px"><div id="vf" style="position:absolute;bottom:0;left:0;right:0;height:100%;background:#fff;border-radius:5px"></div></div></div></div><div id="grid"></div></div>
<div id="side"><ul id="list"></ul></div><button id="backBtn">← Geri</button>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
var all=[];var c=[];var idx=0;var cat="hamisi";var fav=JSON.parse(localStorage.getItem("qerib_fav")||"[]");
var v=document.getElementById("v"),box=document.getElementById("vidBox"),hd=document.getElementById("hd"),side=document.getElementById("side"),list=document.getElementById("list"),grid=document.getElementById("grid"),cnt=document.getElementById("cnt"),favCnt=document.getElementById("favCnt"),volBox=document.getElementById("volBox"),vf=document.getElementById("vf"),vt=document.getElementById("vt"),backBtn=document.getElementById("backBtn");
// M3U OXUYAN FUNKSIYA
function parseM3U(text){var lines=text.split("\n");var res=[];var name="";for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(l.startsWith("#EXTINF")){var p=l.split(",");name=p[p.length-1]||"Kanal";}else if(l &&!l.startsWith("#") && l.startsWith("http")){res.push({name:name,url:l});name="";}}return res;}
function load(){fetch("kanallar.m3u?v="+Date.now()).then(r=>r.text()).then(t=>{all=parseM3U(t);applyCat();}).catch(()=>{cnt.textContent="kanallar.m3u tapilmadi"})}
function applyCat(){if(cat=="hamisi")c=all;else c=all.filter(x=>fav.includes(x.url));cnt.textContent="("+c.length+")";favCnt.textContent=fav.length;render();if(c.length>0)play(0)}
var hls;function play(i){idx=i;render();if(!c[i])return;var u=c[i].url;if(hls)hls.destroy();if(Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play()})}else{v.src=u;v.play()}showBar()}
function render(){list.innerHTML="";grid.innerHTML="";for(var i=0;i<c.length;i++){var isFav=fav.includes(c[i].url);var li=document.createElement("li");li.innerHTML="<span>"+c[i].name+"</span><span onclick='event.stopPropagation();toggleFav(\""+c[i].url+"\")'>"+(isFav?"⭐":"☆")+"</span>";if(i==idx)li.className="active";(function(ii){li.onclick=function(){play(ii);side.classList.remove("open")}})(i);list.appendChild(li);var d=document.createElement("div");d.innerHTML="<span>"+c[i].name+"</span><span>"+(isFav?"⭐":"☆")+" ▶</span>";if(i==idx)d.className="active";(function(ii){d.onclick=function(){play(ii)}})(i);grid.appendChild(d)}}
function toggleFav(url){if(fav.includes(url))fav=fav.filter(x=>x!=url);else fav.push(url);localStorage.setItem("qerib_fav",JSON.stringify(fav));favCnt.textContent=fav.length;if(cat=="sevimli")applyCat();else render()}
var tmr;function showBar(){hd.classList.remove("hide");backBtn.style.display="block";clearTimeout(tmr);tmr=setTimeout(function(){if(box.classList.contains("full")){hd.classList.add("hide");backBtn.style.display="none"}},3000)}
document.querySelectorAll(".cat").forEach(b=>{b.onclick=function(){document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));this.classList.add("active");cat=this.dataset.c;applyCat()}});
var isLight=localStorage.getItem("light")=="1";if(isLight)document.body.classList.add("light");
document.getElementById("th").onclick=function(){document.body.classList.toggle("light");localStorage.setItem("light",document.body.classList.contains("light")?"1":"0")};
document.getElementById("mn").onclick=function(){side.classList.toggle("open");showBar()};
document.getElementById("fs").onclick=toggleFull;backBtn.onclick=toggleFull;
function toggleFull(){box.classList.toggle("full");var f=box.classList.contains("full");document.getElementById("fs").textContent=f?"⛶ Kiçilt":"⛶";backBtn.textContent=f?"✕ Bağla":"← Geri";if(f){box.requestFullscreen&&box.requestFullscreen();showBar()}else{document.exitFullscreen&&document.exitFullscreen();hd.classList.remove("hide")}}
v.addEventListener("click",function(){if(hd.classList.contains("hide"))showBar();else{hd.classList.add("hide");backBtn.style.display="none"}});
var sx=0,sy=0,sv=1,isV=false;document.getElementById("gR").addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;sv=v.volume;isV=false;volBox.style.display="flex";showBar()},{passive:true});
document.getElementById("gR").addEventListener("touchmove",function(e){if(Math.abs(e.touches[0].clientY-sy)>Math.abs(e.touches[0].clientX-sx)){isV=true;var vv=Math.min(1,Math.max(0,sv+(sy-e.touches[0].clientY)/180));v.volume=vv;vf.style.height=(vv*100)+"%";vt.textContent=Math.round(vv*100)+"%"}},{passive:true});
document.getElementById("gR").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(!isV&&Math.abs(dx)>60){if(dx>0)play((idx-1+c.length)%c.length);else play((idx+1)%c.length)}setTimeout(function(){volBox.style.display="none"},1000)},{passive:true});
var sx2=0;document.getElementById("gL").addEventListener("touchstart",function(e){sx2=e.touches[0].clientX},{passive:true});
document.getElementById("gL").addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-sx2;if(Math.abs(d)>60){if(d>0)play((idx-1+c.length)%c.length);else play((idx+1)%c.length)}},{passive:true});
var tsx=0;document.addEventListener("touchstart",function(e){tsx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-tsx;if(tsx<30&&d>70)side.classList.add("open");if(d<-70&&side.classList.contains("open"))side.classList.remove("open")});
load();
</script></body></html>
